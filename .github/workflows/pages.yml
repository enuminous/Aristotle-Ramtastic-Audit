name: Website checks and Pages deployment
on:
  push:
    branches: [main]
    paths:
      - index.html
      - site-assets/**
      - scripts/check_site.py
      - .github/workflows/pages.yml
      - .nojekyll
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: website-pages
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pages-enabled: ${{ steps.pages-state.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check website links, catalogue, and scripts
        run: |
          python3 scripts/check_site.py
          node --check site-assets/rotation.js
          node --check site-assets/site.js
      - name: Check whether Pages is enabled
        id: pages-state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          request = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['REPOSITORY'] + '/pages',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'X-GitHub-Api-Version': '2022-11-28'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              enabled = data.get('build_type') == 'workflow'
              branch_publishing = data.get('build_type') == 'legacy'
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              enabled = False
              branch_publishing = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('enabled=' + str(enabled).lower() + '\n')
          if branch_publishing:
              message = ('Website checks passed. Pages is enabled with branch publishing; '
                         'GitHub\'s automatic Pages workflow handles deployment. '
                         'No additional setup is required.')
              print('::notice::' + message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## Automatic branch publication\n\n' + message + '\n')
          elif not enabled:
              message = ('Website checks passed; deployment is pending. In Settings > Pages, '
                         'select GitHub Actions as the source, then rerun this workflow.')
              print('::notice::' + message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('## Pages setup required\n\n' + message + '\n')
          PY
      - name: Configure Pages
        if: steps.pages-state.outputs.enabled == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Prepare static files
        if: steps.pages-state.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r site-assets _site/
      - name: Upload website
        if: steps.pages-state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
  deploy:
    needs: prepare
    if: needs.prepare.outputs.pages-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
